<!-- ==========================================================================
     HERO SECTION
     Extracted from designs/hero.png (Pixel-Perfect & Responsive)
     ========================================================================== -->
<section class="hero" id="hero">
  <div class="container hero__grid">
    <!-- Left Column: Content & Typography -->
    <div class="hero__content">
      <!-- Status Badge -->
      <div class="hero__status reveal-on-scroll">
        <span class="status-badge">
          <span class="dot" aria-hidden="true"></span>
          AVAILABLE FOR SELECT PROJECTS
        </span>
      </div>

      <!-- Main Headline: I BUILD DIGITAL THINGS® -->
      <h1 class="hero__title reveal-on-scroll" data-reveal-delay="100">
        I BUILD<br>
        <span class="hero__title-highlight">DIGITAL</span><br>
        THINGS<span class="hero__title-reg">®</span>
      </h1>

      <!-- Lead Paragraph -->
      <p class="hero__lead reveal-on-scroll" data-reveal-delay="200">
        I turn ideas, messy requirements and technical problems into software people can actually use.
      </p>

      <!-- Roles Breakdown (01, 02, 03) -->
      <div class="hero__roles reveal-cascade cascade--3col reveal-on-scroll">
        <div class="hero__role">
          <span class="hero__role-num">01</span>
          <div class="hero__role-title">BACKEND<br>ENGINEER</div>
        </div>
        <div class="hero__role">
          <span class="hero__role-num">02</span>
          <div class="hero__role-title">ANDROID<br>BUILDER</div>
        </div>
        <div class="hero__role">
          <span class="hero__role-num">03</span>
          <div class="hero__role-title">PRODUCT<br>DEVELOPER</div>
        </div>
      </div>

      <!-- Call-To-Action Cluster -->
      <div class="hero__ctas reveal-cascade cascade--2col reveal-on-scroll">
        <a href="pages/contact.html" class="hero__btn-primary">
          <span>START A PROJECT</span>
          <span class="btn-arrow" aria-hidden="true">→</span>
        </a>
        <a href="pages/projects.html" class="hero__btn-secondary">
          <span>SEE MY WORK</span>
        </a>
      </div>
    </div>

    <!-- Right Column: 3D Architectural Vector Graphic -->
    <div class="hero__visual reveal-on-scroll" data-reveal-delay="150">
      <div class="hero__visual-wrapper parallax-drift" data-drift-factor="0.08">
        <div class="ambient-float">
          <img src="images/hero-image.svg" alt="Digital Product Architecture Diagram - Idea, Architecture, Build, Product" class="hero__graphic" width="1034" height="728" loading="eager">
        </div>
      </div>
    </div>

    <!-- Full-Width Hero Footer Bar: Scroll Indicator & Motto -->
    <div class="hero__footer reveal-on-scroll" data-reveal-delay="350">
      <a href="#selected-work" class="hero__scroll" aria-label="Scroll to selected work">
        <span class="scroll-text">SCROLL</span>
        <span class="scroll-arrow" aria-hidden="true">↓</span>
      </a>
      <div class="hero__motto">
        [ FROM IDEA TO IMPACT ]
      </div>
    </div>
  </div>
</section>
